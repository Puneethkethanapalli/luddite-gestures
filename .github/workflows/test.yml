name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 jq
          && sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua

      - name: Unit tests
        run: node test/run.js

      # The parts of `omarchy plugin validate` that do not need Omarchy present.
      - name: Validate manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e 'has("id") and has("name") and has("version")
                 and has("kinds") and has("entryPoints")' manifest.json
          jq -e '.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and (startswith("omarchy.") | not)' manifest.json
          jq -e '(.kinds | type) == "array" and (.kinds | length) > 0' manifest.json
          for ep in $(jq -r '.entryPoints[]' manifest.json); do
            case "$ep" in /*|*..*) echo "unsafe entry point: $ep"; exit 1 ;; esac
            test -f "$ep" || { echo "missing entry point: $ep"; exit 1; }
          done
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)" || { echo "symlinks not allowed"; exit 1; }
