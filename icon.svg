<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Touchpad -->
  <rect x="6" y="12" width="52" height="40" rx="7"
        fill="none" stroke="#8aadf4" stroke-width="3.5"/>
  <!-- Two fingers, mid-swipe -->
  <circle cx="24" cy="30" r="4.5" fill="#8aadf4"/>
  <circle cx="24" cy="42" r="4.5" fill="#8aadf4"/>
  <!-- Motion -->
  <path d="M33 30 H46 M33 42 H46" stroke="#8aadf4" stroke-width="3.5"
        stroke-linecap="round" opacity="0.55"/>
  <path d="M42 25.5 L47.5 30 L42 34.5" fill="none" stroke="#8aadf4"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
